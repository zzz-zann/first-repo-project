<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai GL Universe | Highlights, Series & Projects</title>
  <style>
    :root {
      --bg-dark: #443fa9af;
      --card-bg: rgba(82, 54, 91, 0.4);
      --card-border: rgba(165, 196, 212, 0.2);
      --accent-pink: #a5c4d4;
      --accent-purple: #8499b1;
      --accent-muted: #7b6d8d;
      --accent-glow: rgba(165, 196, 212, 0.25);
      --text-main: #f3f4f6;
      --text-sub: #b8c1ec;
      --glass-blur: blur(14px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(244, 114, 182, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      backdrop-filter: var(--glass-blur);
      background: rgba(15, 12, 27, 0.8);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-bar {
      width: 100%;
      padding: 0.6rem 1.2rem;
      border-radius: 99px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 12px var(--accent-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .controls {
      max-width: 1200px;
      margin: 2rem auto 1rem;
      padding: 0 1.5rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 0.5rem 1.25rem;
      border-radius: 99px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
      border-color: rgba(244, 114, 182, 0.4);
    }

    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #2a2040;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge {
      align-self: flex-start;
      background: rgba(244, 114, 182, 0.15);
      color: var(--accent-pink);
      border: 1px solid rgba(244, 114, 182, 0.3);
      padding: 0.2rem 0.75rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    .fandom-name {
      color: var(--accent-purple);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .card-desc {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .project-list {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
    }

    .project-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      background: rgba(255, 255, 255, 0.06);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #e5e7eb;
    }

    .btn-detail {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.6rem;
      background: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-detail:hover {
      background: var(--accent-purple);
      color: #fff;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #161228;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .close-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      background: var(--accent-pink);
    }

    footer {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-sub);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      margin-top: 4rem;
    }

    footer a {
      color: var(--accent-pink);
      text-decoration: none;
    }
  </style>
</head>

      {

        projects: ["Starring: Mie Phattaranan", "Starring: Aya Orapan"],
        details: "An original production by Me Mind Y, a prominent Thai production house."
      },
      {
        id: 12,
        type: "series",
        title: "Reverse With Me",
        fandom: "Romance, Fantasy",
        agency: "2025",
        img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcdo3VoHUi_Ab_Ee1Ngw5UUWQs8Ufym7yQS0C1EH9LgwAKwtxRb-OLZOg&s=10",
        description: "After seven years of separation, the two reunite in a hospital emergency room, unraveling past accidents, shared dreams, and hidden secrets.",
        projects: ["Starring: Natt Nattamon", "Starring: Pitcha Pitchatorn"],
        details: "Adapted from the novel \"Reverse with me: Across Millions of Orbits\" (Reverse With Me ล้านวงโคจร) by Zezeho."
      }
    ];

    // DOM Elements
    const cardsGrid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalBody = document.getElementById('modalBody');
    const closeModal = document.getElementById('closeModal');

    let currentFilter = 'all';
    let searchQuery = '';

    // Render Function
    function renderCards() {
      cardsGrid.innerHTML = '';

      const filteredData = glData.filter(item => {
        const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery) ||
                              item.fandom.toLowerCase().includes(searchQuery) ||
                              item.description.toLowerCase().includes(searchQuery) ||
                              item.projects.some(p => p.toLowerCase().includes(searchQuery));
        return matchesFilter && matchesSearch;
      });

      if (filteredData.length === 0) {
        cardsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 3rem;">No GL items found matching your query.</p>`;
        return;
      }

      filteredData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}" class="card-img" loading="lazy">
          <div class="card-content">
            <span class="badge">${item.type}</span>
            <h2 class="card-title">${item.title}</h2>
            <div class="fandom-name">${item.fandom} • ${item.agency}</div>
            <p class="card-desc">${item.description}</p>
            <div class="project-list">
              <div class="project-title">Key Projects & Highlights</div>
              <div class="tag-group">
                ${item.projects.map(p => `<span class="tag">${p}</span>`).join('')}
              </div>
            </div>
            <button class="btn-detail" onclick="openModal(${item.id})">View Details</button>
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    // Modal Handlers
    window.openModal = function(id) {
      const item = glData.find(d => d.id === id);
      if (!item) return;

      modalBody.innerHTML = `
        <span class="badge">${item.type}</span>
        <h2 style="font-size: 1.75rem; margin: 0.5rem 0 0.25rem;">${item.title}</h2>
        <p style="color: var(--accent-purple); font-weight: 600; margin-bottom: 1rem;">${item.fandom} | ${item.agency}</p>
        <img src="${item.img}" style="width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem;">
        <p style="color: #e5e7eb; margin-bottom: 1.25rem;">${item.details}</p>
        <h4 style="font-size: 0.9rem; text-transform: uppercase; color: var(--text-sub); margin-bottom: 0.5rem;">Notable Projects</h4>
        <div class="tag-group">
          ${item.projects.map(p => `<span class="tag" style="background: rgba(244,114,182,0.15);">${p}</span>`).join('')}
        </div>
      `;
      modalOverlay.classList.add('active');
    };

    closeModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // Event Listeners for Filters & Search
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderCards();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderCards();
    });

    // Initial Render
    renderCards();
  </script>
</body>
