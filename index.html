  <style>
    :root {
      /* Lovely Universe Theme Palette */
      --bg-dark: #0f0c1b;
      --card-bg: rgba(30, 22, 53, 0.55);
      --card-border: rgba(244, 114, 182, 0.25);
      --accent-pink: #f472b6;
      --accent-purple: #c084fc;
      --accent-glow: rgba(244, 114, 182, 0.35);
      --text-main: #f9fafb;
      --text-sub: #d1d5db;
      --glass-blur: blur(16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(244, 114, 182, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(192, 132, 252, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 60%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      backdrop-filter: var(--glass-blur);
      background: rgba(15, 12, 27, 0.85);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.3));
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 400px;
    }

    .search-bar {
      width: 100%;
      padding: 0.6rem 1.2rem;
      border-radius: 99px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 15px var(--accent-glow);
      background: rgba(255, 255, 255, 0.09);
    }

    /* Hero Header with Thailand Background Photo */
    .hero-header {
      position: relative;
      background: linear-gradient(180deg, rgba(15, 12, 27, 0.75) 0%, rgba(15, 12, 27, 0.92) 100%), 
                  url('https://files1.anextour.in/user-files/elfinder/Anex.in/blogs/Day%201.webp') center/cover no-repeat;
      padding: 5rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--card-border);
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 800;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      color: var(--text-sub);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }

    .controls {
      max-width: 1200px;
      margin: 2rem auto 1rem;
      padding: 0 1.5rem;
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 0.5rem 1.25rem;
      border-radius: 99px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 20px var(--accent-glow);
      transform: translateY(-2px);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.75rem;
    }

    /* Fade-In & Slide-Up Animation Effects */
    @keyframes fadeInStagger {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: var(--glass-blur);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      animation: fadeInStagger 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 25px var(--accent-glow);
      border-color: rgba(244, 114, 182, 0.6);
    }

    .card-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #1a1528;
    }

    .card-content {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .badge {
      align-self: flex-start;
      background: rgba(244, 114, 182, 0.15);
      color: var(--accent-pink);
      border: 1px solid rgba(244, 114, 182, 0.35);
      padding: 0.2rem 0.75rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    .fandom-name {
      color: var(--accent-purple);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .card-desc {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .project-list {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
    }

    .project-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      background: rgba(255, 255, 255, 0.07);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #e5e7eb;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .btn-detail {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.6rem;
      background: transparent;
      border: 1px solid var(--accent-purple);
      color: var(--accent-purple);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: center;
    }

    .btn-detail:hover {
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 8, 20, 0.8);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #18122d;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(192, 132, 252, 0.2);
      animation: fadeInStagger 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .close-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: var(--accent-pink);
    }

    footer {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-sub);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      margin-top: 4rem;
      background: rgba(10, 8, 20, 0.4);
    }

    footer a {
      color: var(--accent-pink);
      text-decoration: none;
    }
  </style>
</head>

        projects: ["Starring: MingMing Kanyakorn", "Starring: Nepjune Nutkitta"],
        details: "A romantic drama series that reimagines Shakespeare's Romeo and Juliet."
      },
      {
        id: 20,
        type: "series",
        title: "Denied Love",
        fandom: "Melodrama, Romance",
        agency: "2025",
        img: "https://vcover-hz-pic.wetvinfo.com/vcover_hz_pic/0/tq1qmgo66p2f38g1747829741780/0",
        description: "Explores arranged marriage dynamics, power imbalances, grief, and emotional restraint",
        projects: ["Starring: Enjoy Thidarat", "Starring: June Nannirin"],
        details: "Adapated from the novel \"Rin Mai Mi Wan Rak\" (รินไม่มีวันรัก) by Peony (พีโอนี)."
      },
      {
        id: 21,
        type: "series",
        title: "Queendom",
        fandom: "Fantasy, Romance",
        agency: "2025",
        img: "https://vcover-hz-pic.wetvinfo.com/vcover_hz_pic/0/g2bste5fitcnpkv1754380893859/0",
        description: "Chaos ensues. Most importantly, though, their feelings towards one another begin to shift as they embody one another.",
        projects: ["Starring: P.amp Tarradee", "Starring: Arhoung Nattawadee"],
        details: " Adapted from the novel \"Queendom\" (QUEENDOM #ซ่อนใจไว้ที่เธอ) by Salmon (แซลม่อน)."
      },
      {
        id: 22,
        type: "series",
        title: "Mate",
        fandom: "Drama, Romance",
        agency: "2024",
        img: "https://vcover-hz-pic.wetvinfo.com/vcover_hz_pic/0/5otuxjhuyyf07zc1732100043264/0",
        description: "Childhood sweethearts, cohabitation, class/status dynamics, dealing with deep trauma, sexual assault recovery, and hidden feelings resurfacing on a wedding day.",
        projects: ["Starring: Grace Budsarin", "Starring: Oaey Ponchanok"],
        details: "Adapted from the novel \"Mate\" (Mate เพื่อนรัก) by Chao Planoy (เจ้าปลาน้อย)."
      }
    ];

    // DOM Elements
    const cardsGrid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalBody = document.getElementById('modalBody');
    const closeModal = document.getElementById('closeModal');

    let currentFilter = 'all';
    let searchQuery = '';

    // Render Function
    function renderCards() {
      cardsGrid.innerHTML = '';

      const filteredData = glData.filter(item => {
        const matchesFilter = currentFilter === 'all' || item.type === currentFilter;
        const matchesSearch = item.title.toLowerCase().includes(searchQuery) ||
                            item.fandom.toLowerCase().includes(searchQuery) ||
                            item.description.toLowerCase().includes(searchQuery) ||
                            item.projects.some(p => p.toLowerCase().includes(searchQuery));
        return matchesFilter && matchesSearch;
      });

      if (filteredData.length === 0) {
        cardsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 3rem;">No GL items found matching your query.</p>`;
        return;
      }

      filteredData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        // Stagger animation delay per card for a cascading entrance effect
        card.style.animationDelay = `${index * 0.05}s`;
        card.innerHTML = `
          <img src="${item.img}" alt="${item.title}" class="card-img" loading="lazy">
          <div class="card-content">
            <span class="badge">${item.type}</span>
            <h2 class="card-title">${item.title}</h2>
            <div class="fandom-name">${item.fandom} | ${item.agency}</div>
            <p class="card-desc">${item.description}</p>
            <div class="project-list">
              <div class="project-title">Key Projects & Highlights</div>
              <div class="tag-group">
                ${item.projects.map(p => `<span class="tag">${p}</span>`).join('')}
              </div>
            </div>
            <button class="btn-detail" onclick="openModal('${item.id}')">View Details</button>
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    // Modal Handlers
    window.openModal = function(id) {
      const item = glData.find(d => d.id == id);
      if (!item) return;

      modalBody.innerHTML = `
        <span class="badge">${item.type}</span>
        <h2 style="font-size: 1.75rem; margin: 0.5rem 0 0.25rem; color: #fff;">${item.title}</h2>
        <p style="color: var(--accent-purple); font-weight: 600; margin-bottom: 1rem;">${item.fandom} | ${item.agency}</p>
        <img src="${item.img}" style="width: 100%; height: 240px; object-fit: cover; border-radius: 12px; margin-bottom: 1rem; border: 1px solid var(--card-border);">
        <p style="color: var(--text-sub); margin-bottom: 1.25rem; line-height: 1.7;">${item.details}</p>
        <h4 style="font-size: 0.9rem; text-transform: uppercase; color: var(--accent-pink); margin-bottom: 0.5rem; letter-spacing: 0.5px;">Notable Projects</h4>
        <div class="tag-group">
          ${item.projects.map(p => `<span class="tag" style="background: rgba(244,114,182,0.12); border-color: rgba(244,114,182,0.3);">${p}</span>`).join('')}
        </div>
      `;
      modalOverlay.classList.add('active');
    };

    closeModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    // Event Listeners for Filters & Search
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderCards();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderCards();
    });

    // Initial Render
    renderCards();
  </script>
</body>
</html>
